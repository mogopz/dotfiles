"brew:kubecolor" = "latest"
"brew:kubeconform" = "latest"
"brew:kubectx" = "latest"
"brew:lazydocker" = "latest"
"brew:lazygit" = "latest"
"brew:lsd" = "latest"
"brew:macchina" = "latest"
"brew:mas" = "latest"
"brew:mise" = "latest"
"brew:neovim" = "latest"
"brew:nmap" = "latest"
"brew:nushell" = "latest"
"brew:pnpm" = "latest"
"brew:pre-commit" = "latest"
"brew:ripgrep" = "latest"
"brew:skopeo" = "latest"
"brew:starship" = "latest"
