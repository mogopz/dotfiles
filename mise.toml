"brew-cask:vlc" = "latest"
"brew-cask:zed" = "latest"
"mas:937984704" = "latest" # Amphetamine

[bootstrap.repos]
"~/dotfiles" = { url = "https://github.com/mogopz/dotfiles", ref = "main" }
"~/.config/nvim" = { url = "https://github.com/LazyVim/starter", ref = "main" }

[bootstrap.macos.dock]
autohide = true
tilesize = 45
magnification = false
show_recents = false

[bootstrap.macos.finder]
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyle = "Dark"
"com.apple.swipescrolldirection" = false

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableStandardClickToShowDesktop = false
EnableTiledWindowMargins = false
EnableTilingByEdgeDrag = false
EnableTilingOptionAccelerator = false
EnableTopTilingByEdgeDrag = false
StandardHideWidgets = true

[bootstrap.hooks.pre-repos]
run = '''
nvim_exclude="${HOME}/.config/nvim/.git/info/exclude"
if [ -f "${nvim_exclude}" ]; then
  for pattern in lazy-lock.json lazyvim.json lua/plugins/theme.lua; do
    grep -qxF "${pattern}" "${nvim_exclude}" || printf '%s\n' "${pattern}" >> "${nvim_exclude}"
  done
fi
'''

[bootstrap.hooks.post-repos]
run = '''
nvim_exclude="${HOME}/.config/nvim/.git/info/exclude"
if [ -f "${nvim_exclude}" ]; then
  for pattern in lazy-lock.json lazyvim.json lua/plugins/theme.lua; do
    grep -qxF "${pattern}" "${nvim_exclude}" || printf '%s\n' "${pattern}" >> "${nvim_exclude}"
  done
fi
'''

[dotfiles]
"~/.config/bat/themes/Catppuccin Mocha.tmTheme" = ".config/bat/themes/Catppuccin Mocha.tmTheme"
"~/.config/ghostty" = ".config/ghostty"
"~/.config/git/ignore" = ".config/git/ignore"
"~/.gitconfig" = ".config/git/config"
"~/.config/lsd" = ".config/lsd"
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/nvim/lua/plugins/theme.lua" = ".config/nvim/theme.lua"
"~/.config/starship.toml" = ".config/starship/starship.toml"
"~/.config/zed/settings.json" = ".config/zed/settings.json"
"~/.zsh/catppuccin-mocha-zsh-syntax-highlighting.zsh" = ".config/zsh/catppuccin-mocha-zsh-syntax-highlighting.zsh"
"~/.zshrc" = ".config/zsh/.zshrc"

[dotfiles."~/Library/Application Support/Rectangle/RectangleConfig.json"]
source = ".config/rectangle/RectangleConfig.json"
mode = "copy"

[tasks.bootstrap]
description = "Install the Homebrew-managed Raycast cask and build Bat's theme cache"
run = '''
# mise throws TLS errors installing Raycast v2
if brew list --cask raycast >/dev/null 2>&1; then
  brew upgrade --cask raycast
else
  brew install --cask raycast
fi
bat cache --build
'''
