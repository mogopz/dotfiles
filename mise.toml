min_version = "2026.8.10"

[settings]
color_theme = "catppuccin"
minimum_release_age = "3d"

[tools]
go = "latest"
node = "lts"
terraform = "latest"
uv = "latest"

[bootstrap.files."/etc/pam.d/sudo_local"]
content = """
# sudo_local: local config file which survives system update and is included for sudo
# uncomment following line to enable Touch ID for sudo
auth       sufficient     pam_tid.so
"""
owner = "root"
group = "wheel"
mode = "0444"

[bootstrap.repos]
"~/.config/nvim" = { url = "https://github.com/LazyVim/starter", ref = "main" }

[bootstrap.macos.dock]
autohide = true
tilesize = 45
magnification = false
show_recents = false

[bootstrap.macos.finder]
show_pathbar = true
preferred_view_style = "list"

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleInterfaceStyle = "Dark"
"com.apple.swipescrolldirection" = false

[bootstrap.macos.defaults."com.apple.WindowManager"]
EnableStandardClickToShowDesktop = false
EnableTiledWindowMargins = false
EnableTilingByEdgeDrag = false
EnableTilingOptionAccelerator = false
EnableTopTilingByEdgeDrag = false
StandardHideWidgets = true

[bootstrap.hooks.pre-repos]
run = '''
nvim_exclude="${HOME}/.config/nvim/.git/info/exclude"
if [ -f "${nvim_exclude}" ]; then
  for pattern in lazy-lock.json lazyvim.json lua/plugins/theme.lua; do
    grep -qxF "${pattern}" "${nvim_exclude}" || printf '%s\n' "${pattern}" >> "${nvim_exclude}"
  done
fi
'''

[bootstrap.hooks.post-repos]
run = '''
nvim_exclude="${HOME}/.config/nvim/.git/info/exclude"
if [ -f "${nvim_exclude}" ]; then
  for pattern in lazy-lock.json lazyvim.json lua/plugins/theme.lua; do
    grep -qxF "${pattern}" "${nvim_exclude}" || printf '%s\n' "${pattern}" >> "${nvim_exclude}"
  done
fi
'''

[dotfiles]
"~/.config/bat/themes/Catppuccin Mocha.tmTheme" = ".config/bat/themes/Catppuccin Mocha.tmTheme"
"~/.config/ghostty" = ".config/ghostty"
"~/.config/git/ignore" = ".config/git/ignore"
"~/.gitconfig" = ".config/git/config"
"~/.config/herdr/config.toml" = ".config/herdr/config.toml"
"~/.config/lsd" = ".config/lsd"
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/nvim/lua/plugins/theme.lua" = ".config/nvim/theme.lua"
"~/.config/starship.toml" = ".config/starship/starship.toml"
"~/.config/zed/settings.json" = ".config/zed/settings.json"
"~/.zsh/catppuccin-mocha-zsh-syntax-highlighting.zsh" = ".config/zsh/catppuccin-mocha-zsh-syntax-highlighting.zsh"
"~/.zshrc" = ".config/zsh/.zshrc"

[dotfiles."~/Library/Application Support/Rectangle/RectangleConfig.json"]
source = ".config/rectangle/RectangleConfig.json"
mode = "copy"

[tasks.check]
description = "Validate dotfiles"
dir = "~/dotfiles"
run = '''
set -eu

mise fmt --check
zsh -n .config/zsh/.zshrc
git diff --check
jq empty .config/rectangle/RectangleConfig.json
'''

[tasks.bootstrap]
description = "Install Homebrew packages and build Bat's theme cache"
dir = "~/dotfiles"
run = '''
set -eu

brew bundle install --no-upgrade
bat cache --build
'''

[tasks.update]
description = "Upgrade Homebrew packages and mise tools"
dir = "~/dotfiles"
run = '''
set -eu

brew update
brew upgrade
brew upgrade --cask
mise upgrade
bat cache --build
'''

[tasks.wallpapers]
description = "Install wallpapers"
dir = "~/dotfiles"
run = '''
set -eu

version="wallpapers-v1"
archive="${version}.tar.gz"
archive_sha256="e63ec226d52eb61af90fe37b45ee4109715a461bfd55b86103cedaa7f3af6a8b"
destination="${HOME}/Pictures/Wallpapers"
manifest="${PWD}/assets/${version}.sha256"
release_url="https://github.com/mogopz/dotfiles/releases/download"

if [ -d "${destination}" ] && (
  cd "${destination}"
  shasum -a 256 --check "${manifest}" >/dev/null 2>&1
); then
  echo "Wallpapers are already installed in ${destination}"
  exit 0
fi

tmp_dir="$(mktemp -d)"
trap 'rm -f "${tmp_dir}/${archive}"; rmdir "${tmp_dir}"' EXIT

curl --fail --location --retry 3 --show-error --silent \
  --output "${tmp_dir}/${archive}" \
  "${release_url}/${version}/${archive}"
printf '%s  %s\n' "${archive_sha256}" "${tmp_dir}/${archive}" | shasum -a 256 --check

mkdir -p "${destination}"
tar -xzf "${tmp_dir}/${archive}" -C "${destination}"
(
  cd "${destination}"
  shasum -a 256 --check "${manifest}"
)
'''
